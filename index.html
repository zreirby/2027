<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Выбор задания • Физика</title>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #090a10;
      --surface-card: rgba(18, 22, 34, 0.72);
      --surface-elevated: rgba(26, 32, 48, 0.85);
      --surface-input: rgba(13, 16, 26, 0.7);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
      
      --border: rgba(255, 255, 255, 0.08);
      --radius-xl: 24px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      
      --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: var(--font);
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 20%, rgba(139, 92, 246, 0.1) 0px, transparent 50%),
        radial-gradient(at 50% 80%, rgba(236, 72, 153, 0.07) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Шапка */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 10, 16, 0.75);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-bottom: 1px solid var(--border);
      padding: 18px 24px;
      text-align: center;
    }

    .header-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.01em;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Главный контейнер */
    main {
      max-width: 680px;
      width: 100%;
      margin: auto;
      padding: 40px 20px;
    }

    .hero {
      text-align: center;
      margin-bottom: 36px;
    }

    .hero h1 {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 17px;
      font-weight: 500;
      color: var(--text-sub);
    }

    /* Карточка меню */
    .menu-card {
      background: var(--surface-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      padding: 36px;
      text-align: center;
    }

    .card-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.25);
      padding: 4px 14px;
      border-radius: 30px;
      margin-bottom: 24px;
    }

    /* Сетка кнопок */
    .buttons-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    /* Кнопка-ссылка */
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      padding: 38px 20px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      transition: all 0.35s var(--ease-spring);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .nav-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--accent-gradient);
      opacity: 0;
      transition: opacity 0.35s var(--ease-spring);
      z-index: 0;
    }

    .nav-btn:hover {
      transform: translateY(-5px);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 20px 35px -10px var(--accent-glow);
    }

    .nav-btn:hover::before {
      opacity: 0.12;
    }

    .nav-btn:active {
      transform: scale(0.97);
    }

    .btn-num {
      position: relative;
      z-index: 1;
      font-size: 44px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1;
      font-family: var(--font);
      background: linear-gradient(135deg, #ffffff 40%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transition: transform 0.35s var(--ease-spring);
    }

    .nav-btn:hover .btn-num {
      transform: scale(1.1);
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @media (max-width: 500px) {
      .buttons-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .nav-btn {
        padding: 28px 16px;
      }

      .hero h1 {
        font-size: 34px;
      }
    }
  </style>
</head>
<body>

  <!-- Шапка -->
  <header>
    <div class="header-title">Домашнее задание</div>
  </header>

  <main>
    <div class="hero">
      <h1>Физика</h1>
      <p>Выберите номер задания для перехода:</p>
    </div>

    <div class="menu-card">
      <div class="card-label">Список заданий</div>
      
      <div class="buttons-grid">
        <!-- Кнопка 1 -> index.html -->
        <a href="dz1.html" class="nav-btn">
          <span class="btn-num">1</span>
        </a>

        <!-- Кнопка 2 -> dz3.html -->
        <a href="dz3.html" class="nav-btn">
          <span class="btn-num">2</span>
        </a>

        <a href="dz3.html" class="nav-btn">
          <span class="btn-num">1</span>
        </a>
        
      </div>
    </div>
  </main>

</body>
</html>
